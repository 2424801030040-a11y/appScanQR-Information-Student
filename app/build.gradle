// build.gradle (Module: app)
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.studentattendance'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.studentattendance"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Material Design 3 (MaterialToolbar, BottomNavigationView, MaterialCardView, ToggleGroup, TextInputLayout...)
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.8.2'

    // ZXing: camera scanning (BarcodeView) + QR/Barcode image generation (BarcodeEncoder)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.4.1'
}
